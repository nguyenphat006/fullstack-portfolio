# Cổng vào duy nhất cho production: frontend và API chung domain (không cần CORS).
#   /api, /admin, /static  -> Django (gunicorn + whitenoise)
#   /media                 -> file upload (volume dùng chung với backend)
#   còn lại                -> Next.js
# HTTPS: đặt sau reverse proxy / load balancer có TLS (Caddy, Cloudflare, Traefik...) hoặc bổ sung server 443 tại đây.

upstream api { server api:8000; }
upstream web { server web:3000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;   # tệp đính kèm / nhập Excel

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/    { proxy_pass http://api; proxy_read_timeout 120s; }
    location /admin/  { proxy_pass http://api; }
    location /static/ { proxy_pass http://api; }

    # Tệp đính kèm chỉ tải qua /api/v1/attachments/<id>/file/?sig=... (có kiểm tra quyền + hết hạn)
    location /media/attachments/ { return 404; }

    location /media/ {
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff;
        expires 7d;
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
