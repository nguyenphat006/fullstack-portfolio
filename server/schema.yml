    User:
      type: object
      description: |-
        Serializer tinh gọn hiển thị danh sách Tài khoản Người dùng (Users).
        Gói gọn các thông tin chính yếu (id, username, họ tên, email, sđt, avatar, roles, trạng thái, ngày tạo/cập nhật),
        loại bỏ toàn bộ permissions để đảm bảo an toàn bảo mật, giảm tải payload và loại bỏ N+1 query.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Tên đăng nhập
          description: Yêu cầu. 150 ký tự hoặc ít hơn. Chỉ là chữ cái, chữ số và @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        name:
          type: string
          readOnly: true
        full_name:
          type: string
          title: Họ và tên hiển thị
          maxLength: 255
        email:
          title: Địa chỉ email
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone_number:
          type: string
          nullable: true
          title: Số điện thoại liên hệ
          maxLength: 30
        avatar:
          type: string
          format: uri
          nullable: true
          title: Ảnh đại diện
        is_active:
          type: boolean
          title: Kích hoạt
          description: Chỉ định xem người dùng này phải được coi là đang hoạt động.
            Bạn nên bỏ chọn này thay vì xóa tài khoản.
        is_superuser:
          type: boolean
          title: Trạng thái superuser
          description: Định rằng người dùng này có tất cả các quyền mà không gán cho
            họ một cách cụ thể.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRoleSimple'
          readOnly: true
        role_codes:
          type: array
          items:
            type: string
          readOnly: true
