          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Mã Id của thực thể đính kèm
        file_name:
          type: string
          title: Tên gốc của tệp
          maxLength: 255
        file_url:
          type: string
          readOnly: true
        file_size:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          title: Dung lượng tệp (bytes)
        file_size_formatted:
          type: string
          readOnly: true
        mime_type:
          type: string
          nullable: true
          title: Định dạng MIME
          maxLength: 100
        file_category:
          allOf:
          - $ref: '#/components/schemas/FileCategoryEnum'
          title: Phân loại tệp
        description:
          type: string
          nullable: true
          title: Mô tả / Ghi chú kỹ thuật
        is_active:
          type: boolean
          title: Trạng thái hoạt động
        created_by:
          type: integer
          readOnly: true
          nullable: true
          title: Người tạo
        created_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Thời điểm cập nhật gần nhất
      required:
      - created_at
      - created_by
      - created_by_name
      - entity_id
      - entity_type
      - file_size_formatted
      - file_url
      - id
      - updated_at
